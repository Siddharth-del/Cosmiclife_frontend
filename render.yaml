# Render Blueprint for the Cosmic Life storefront (a static site).
# Render dashboard -> New -> Blueprint -> choose the repo that holds this folder.
# Before deploying, replace YOUR-BACKEND in the /api rewrite below with your backend's Render URL.
services:
  - type: web
    runtime: static
    name: cosmic-life
    # If this project sits in a subfolder of your repo, set rootDir to that folder.
    # rootDir: ./cosmic-life
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
    routes:
      # API: Render forwards /api/... to the backend, so the browser only talks to this site.
      # Must stay above the index.html rule. Replace YOUR-BACKEND. The browser's Origin header may be
      # forwarded too, so also add this site's URL to the backend's CORS_ALLOWED_ORIGINS; the backend
      # answers 403 "Invalid CORS request" to origins it doesn't know.
      - type: rewrite
        source: /api/*
        destination: https://forgex-website.onrender.com/api/*
      # Single-page app: every page URL serves index.html (real files in dist/ are served first).
      - type: rewrite
        source: /*
        destination: /index.html
